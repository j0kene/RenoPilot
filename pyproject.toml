[project]
name = "renopilot"
version = "0.1.0"
description = "From mood board to a compliant, priced shortlist for BTO owners in Singapore (CS621 project)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-core>=1.0",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.7",   # only for the end-of-project model swap
    "pydantic>=2.7",
    "numpy>=1.26",
    "pillow>=10",
    "requests>=2.31",
    "rank-bm25>=0.2.2",
    "open-clip-torch>=2.24",
    "torch>=2.3",
    "python-dotenv>=1.0",
    "transformers>=5.20.2",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
]

[dependency-groups]
dev = ["pytest>=8"]
ui = [
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["renopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real model backend (claude CLI); skipped unless RENOPILOT_LIVE=1"]
